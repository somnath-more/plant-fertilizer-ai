spring.application.name=product-service
server.port=8082
# =====================
# Database Configuration
# =====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/organic_fertilizer_products?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =====================
# Redis
# =====================
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# =====================
# Eureka Client
# =====================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.server.enable-self-preservation=false
# Ensure automatic restart is not disabled
spring.devtools.restart.enabled=true
# Ensure LiveReload is enabled (if you use it)
spring.devtools.livereload.enabled=true
# Ensure the correct folders are being watched (default is fine usually)
spring.devtools.restart.additional-paths=src/main/java

# =====================
# Multipart File Upload
# =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Image storage service used for all product image uploads
image-storage-service.url=${IMAGE_STORAGE_URL:http://localhost:8087}

