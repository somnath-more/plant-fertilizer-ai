name: Frontend CI and images
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Validate deployment configuration and rollback
        env:
          IMAGE_PREFIX: ghcr.io/example/plant
          IMAGE_TAG: ${{ github.sha }}
        run: |
          node deploy/tests/config.test.cjs
          bash -n deploy/transfer.sh
          bash -n deploy/deploy.sh
          bash deploy/tests/deploy.test.sh
          docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  publish-frontend:
    name: Publish frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

